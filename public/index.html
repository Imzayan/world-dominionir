<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Dominion — Sovereign Grid</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#071a35;color:#fff;font-family:Tahoma,Arial,sans-serif;height:100%;overflow:hidden}
button,input{font:inherit}button{border:0;color:#fff;cursor:pointer}
#app{height:100%;position:relative;background:radial-gradient(circle at 50% 25%,#124b86 0,#071a35 60%,#041124 100%)}
.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:10px;display:flex;gap:8px;justify-content:space-between;align-items:center;background:linear-gradient(#06162de8,#06162d88,transparent)}
.brand{font-weight:900;font-size:18px}.stats{display:flex;gap:6px;overflow:auto;max-width:75%}.stat{background:#102d52d9;border:1px solid #4c78a5;border-radius:14px;padding:7px 10px;white-space:nowrap;font-size:12px}.stat b{display:block;font-size:14px}
.mapwrap{position:absolute;inset:65px 0 0}.map{width:100%;height:100%}.country{stroke:#77a1c5;stroke-width:.45;cursor:pointer;transition:.15s}.country:hover{stroke:#fff;stroke-width:1.5}.selected{stroke:#ffe45c!important;stroke-width:2.5!important}.mine{stroke:#67f6a0!important;stroke-width:1.4}
.panel{position:absolute;z-index:8;right:10px;left:10px;bottom:12px;background:linear-gradient(180deg,#102e55f5,#071a34f5);border:1px solid #5a83ae;border-radius:24px;padding:14px;box-shadow:0 15px 40px #0008;max-height:45vh;overflow:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.title{font-size:19px;font-weight:900}.muted{color:#a9c0d8;font-size:12px}.btn{padding:11px 15px;border-radius:14px;background:#3269e9;font-weight:800}.btn.red{background:#bd3d4a}.btn.green{background:#1d9b70}.btn.purple{background:#7a4de0}.btn.ghost{background:#17395f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.box{background:#0a2341;border:1px solid #315a83;border-radius:14px;padding:8px;text-align:center}.box b{display:block;font-size:16px}
.modal{position:absolute;z-index:20;inset:0;background:#020a14cc;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);background:#0b2341;border:1px solid #547da7;border-radius:24px;padding:20px;box-shadow:0 20px 60px #000b}.card h1{margin:0 0 5px}.input{width:100%;padding:13px;border-radius:13px;border:1px solid #3b638a;background:#06172d;color:#fff;margin:6px 0;outline:none}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;background:#123458;padding:10px;border-radius:12px}.tabs .on{background:#346fe9}.wide{width:100%;margin-top:8px}.msg{padding:6px 0;border-bottom:1px solid #193653;font-size:12px}.chat{max-height:150px;overflow:auto;margin-top:8px}.toast{position:absolute;z-index:30;top:75px;left:50%;transform:translateX(-50%);background:#071a32ee;border:1px solid #537da6;padding:10px 14px;border-radius:14px;display:none}
.bottom{position:absolute;z-index:7;left:10px;bottom:12px;display:flex;gap:8px}.fab{border-radius:18px;padding:12px 15px;background:#2b65d9}.hidden{display:none!important}

:root{--bg:#050a12;--panel:#091521eF;--line:#27475d;--cyan:#55e6ff;--gold:#ffc857;--danger:#ff5266;--green:#50f0a0}
body{background:#03070d}.top{background:linear-gradient(180deg,#03070df5 0%,#03070dcc 58%,transparent 100%);padding:12px 14px}.brand{letter-spacing:.4px;text-transform:uppercase}.brand:after{content:' / SOVEREIGN GRID';color:#6f8da5;font-size:9px;margin-right:5px}.stats{max-width:78%}.stat{background:#07131ff2;border-color:#234156;box-shadow:inset 0 1px #ffffff08}.stat b{color:#eef9ff}.mapwrap{inset:68px 0 58px;background:radial-gradient(circle at 50% 45%,#0c2944 0,#06101c 48%,#03070d 100%)}.mapwrap:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.8%,#4ddfff16 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#4ddfff12 50%,transparent 50.2%);background-size:80px 80px;mix-blend-mode:screen}.country{stroke:#66869a;stroke-width:.38;filter:drop-shadow(0 0 1px #000)}.country:hover{filter:drop-shadow(0 0 5px #55e6ff)}.mine{stroke:var(--green)!important;filter:drop-shadow(0 0 5px #50f0a088)}.selected{stroke:var(--gold)!important;filter:drop-shadow(0 0 9px #ffc857aa)}.panel{right:12px;left:auto;bottom:14px;width:min(430px,calc(100% - 24px));background:linear-gradient(180deg,#0a1724f7,#050d16f8);border-color:#31556e;border-radius:18px}.title{letter-spacing:.2px}.box{background:#06111d;border-color:#1d394d}.btn{background:#0e8db3;box-shadow:0 5px 18px #0005}.btn.red{background:#a62f45}.btn.green{background:#16885f}.btn.purple{background:#5d45ad}.btn.ghost{background:#0a2032}.fab{background:#071824eF;border:1px solid #2c536c;box-shadow:0 7px 20px #0008}.fab:hover{border-color:#55e6ff}.modal{background:#02060bdc;backdrop-filter:blur(8px)}.card{background:linear-gradient(145deg,#0a1827,#050b13);border-color:#31556d}.card h1{font-size:27px;letter-spacing:-.5px}.input{background:#040b12;border-color:#24465d}.tabs button{background:#081925;border:1px solid #17364b}.tabs .on{background:#0e8db3;border-color:#55e6ff}.toast{border-color:#3a6279;box-shadow:0 10px 30px #0009}.scanline{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,#55e6ff03 4px);mix-blend-mode:screen}.sector{position:absolute;inset:12%;border:1px solid #55e6ff08;border-radius:50%;pointer-events:none}.sector:before,.sector:after{content:'';position:absolute;inset:14%;border:1px solid #55e6ff06;border-radius:50%}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-left:5px}
@media(max-width:600px){.stats{gap:4px}.stat{padding:6px 8px}.stat:nth-child(n+5){display:none}.panel{width:calc(100% - 20px);right:10px;bottom:10px}.bottom{left:10px;right:10px;justify-content:center}.fab{flex:1;padding:11px 8px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><div class="brand">🌍 World Dominion</div><div class="muted" id="userLabel"><span class="live-dot"></span>آفلاین</div></div>
    <div class="stats">
      <div class="stat">💰 طلا<b id="gold">0</b></div>
      <div class="stat">🌾 غذا<b id="food">0</b></div>
      <div class="stat">🛢️ نفت<b id="oil">0</b></div>
      <div class="stat">⚔️ ارتش<b id="army">0</b></div>
      <div class="stat">🟢 آنلاین<b id="online">0</b></div>
    </div>
  </div>
  <div class="mapwrap"><div class="scanline"></div><div class="sector"></div><svg id="map" class="map"></svg></div>
  <div id="panel" class="panel hidden"></div>
  <div class="bottom">
    <button class="fab" onclick="showAlliances()">🤝 اتحاد</button>
    <button class="fab" onclick="showChat()">💬 چت</button>
    <button class="fab" onclick="showBoard()">🏆 رتبه</button><button class="fab" onclick="showIntel()">◈ اطلاعات</button>
  </div>
  <div id="toast" class="toast"></div>
  <div id="auth" class="modal">
    <div class="card">
      <h1>🌍 World Dominion</h1><div class="muted">نسخه آنلاین چندنفره</div>
      <div class="tabs"><button id="loginTab" class="on" onclick="mode='login';drawAuth()">ورود</button><button id="regTab" onclick="mode='register';drawAuth()">ثبت‌نام</button></div>
      <div id="authForm"></div>
    </div>
  </div>
</div>
<script>
let mode="login", token=localStorage.getItem("wd_token"), player=null, state=null, selected=null, socket=null;
const colors=["#1d8d78","#315ab7","#7048b8","#a35b2d","#2d8b4e","#865eaa","#286f98","#7c4a4a","#4e7a39"];
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",2500)}
async function showIntel(){
  try{const j=await api('/api/leaderboard');
  const owned=state.countries.filter(c=>c.owner_id===player.id).length;
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('panel').innerHTML=`<div class="row"><div><div class="title">◈ مرکز اطلاعات</div><div class="muted">Sovereign Grid / Live telemetry</div></div><button class="btn ghost" onclick="closePanel()">✕</button></div><div class="grid"><div class="box">سرزمین<b>${owned.toLocaleString('fa-IR')}</b></div><div class="box">سطح<b>${player.level}</b></div><div class="box">XP<b>${Number(player.xp).toLocaleString('fa-IR')}</b></div></div><div class="box" style="text-align:right"><b>امضای بازی</b><div class="muted" style="line-height:1.8">رابط «Sovereign Grid»: نقشه تاریک، خطوط تاکتیکی، داشبورد فرماندهی و اطلاعات لحظه‌ای. هدف این نسخه این است که حس یک اتاق فرمان مدرن را بدهد، نه کپی مستقیم از بازی مرجع.</div></div><div class="box" style="margin-top:7px;text-align:right"><b>وضعیت شبکه</b><div class="muted">سرور: آنلاین • اتصال بلادرنگ: فعال • بازیکنان: ${state.online}</div></div>`;
  }catch(e){toast(e.message)}
}
function drawAuth(){document.getElementById("loginTab").classList.toggle("on",mode==="login");document.getElementById("regTab").classList.toggle("on",mode==="register");document.getElementById("authForm").innerHTML=`
<input class="input" id="email" placeholder="ایمیل" type="email">
${mode==="register"?'<input class="input" id="username" placeholder="نام فرمانده">':''}
<input class="input" id="password" placeholder="رمز عبور" type="password">
<button class="btn wide" onclick="authAction()">${mode==="login"?"ورود به جهان":"ساخت حساب"}</button>`}
async function api(url,opts={}){
  opts.headers={...(opts.headers||{}), ...(opts.body?{"Content-Type":"application/json"}:{}), ...(token?{Authorization:"Bearer "+token}:{})};
  let r;
  try { r=await fetch(url,{...opts,credentials:"same-origin"}); }
  catch(e){ throw Error("اتصال به سرور برقرار نشد. اگر سایت روی Render است، سرویس هنوز بالا نیامده یا آدرس API اشتباه است."); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(j.error||`خطای سرور (${r.status})`);
  return j;
}
async function authAction(){try{const body={email:email.value,password:password.value};if(mode==="register")body.username=username.value;const j=await api("/api/"+(mode==="login"?"login":"register"),{method:"POST",body:JSON.stringify(body)});token=j.token;localStorage.setItem("wd_token",token);document.getElementById("auth").classList.add("hidden");await boot()}catch(e){toast(e.message)}}
async function boot(){try{state=await api("/api/state");player=state.player;renderStats();connect();await loadMap();await syncCountries();await refreshState()}catch(e){toast(e.message);localStorage.removeItem("wd_token");document.getElementById("auth").classList.remove("hidden")}}
function renderStats(){document.getElementById("userLabel").textContent=player.username+(player.country_code?" • "+player.country_code:" • بدون کشور");["gold","food","oil","army","online"].forEach(k=>document.getElementById(k).textContent=Number(k==="online"?state.online:player[k]).toLocaleString("fa-IR"))}
function connect(){socket=io({auth:{token}});socket.on("connect_error",()=>toast("اتصال لحظه‌ای قطع شد"));socket.on("state:changed",()=>refreshState());socket.on("chat:new",m=>addChat(m));socket.on("battle:result",b=>toast(b.result==="victory"?"🏆 پیروزی!":"💥 شکست!"));socket.on("online:ping",()=>refreshState());setInterval(()=>socket.connected&&socket.emit("presence"),30000)}
async function syncCountries(){const raw=await d3.json("https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson");const list=raw.features.map(f=>({code:f.properties.ADM0_A3||f.properties.ISO_A3,name:f.properties.NAME||f.properties.ADMIN})).filter(x=>x.code&&x.code!=="-99"&&x.name);await api("/api/countries/sync",{method:"POST",body:JSON.stringify({countries:list})})}
async function refreshState(){state=await api("/api/state");player=state.player;renderStats();drawMap();if(selected)showCountry(selected)}
async function loadMap(){window.geo=await d3.json("https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson");drawMap()}
function drawMap(){const svg=d3.select("#map"), w=innerWidth,h=innerHeight-65;svg.attr("viewBox",`0 0 ${w} ${h}`);svg.selectAll("*").remove();const p=d3.geoMercator().fitExtent([[8,8],[w-8,h-8]],geo);const path=d3.geoPath(p);const owned=new Map((state?.countries||[]).map(c=>[c.code,c]));svg.selectAll("path").data(geo.features).join("path").attr("class","country").attr("d",path).attr("fill",d=>{const c=owned.get(d.properties.ADM0_A3||d.properties.ISO_A3);if(!c||!c.owner_id)return "#173b63";return colors[Number(c.owner_id)%colors.length]}).classed("mine",d=>{const c=owned.get(d.properties.ADM0_A3||d.properties.ISO_A3);return c?.owner_id===player?.id}).classed("selected",d=>(d.properties.ADM0_A3||d.properties.ISO_A3)===selected).on("click",(_,d)=>showCountry(d.properties.ADM0_A3||d.properties.ISO_A3))}
function showCountry(code){selected=code;const c=state.countries.find(x=>x.code===code);const f=geo.features.find(x=>(x.properties.ADM0_A3||x.properties.ISO_A3)===code);const name=c?.name||f?.properties?.NAME||code;if(!c){document.getElementById("panel").innerHTML=`<b>${name}</b><div class="muted">اطلاعات کشور هنوز همگام نشده.</div>`;document.getElementById("panel").classList.remove("hidden");return}const mine=c.owner_id===player.id;document.getElementById("panel").innerHTML=`<div class="row"><div><div class="title">${name}</div><div class="muted">${c.owner_username?"مالک: "+c.owner_username:"کشور آزاد"} ${mine?"• کشور تو":""}</div></div><button class="btn ghost" onclick="closePanel()">✕</button></div><div class="grid"><div class="box">قدرت<b>${Number(c.power).toLocaleString("fa-IR")}</b></div><div class="box">جمعیت<b>${Number(c.population).toLocaleString("fa-IR")}</b></div><div class="box">وضعیت<b>${mine?"خودی":c.owner_id?"دشمن":"آزاد"}</b></div></div>${mine?'<button class="btn green wide" onclick="closePanel()">کشور تحت کنترل توست</button>':c.owner_id?'<button class="btn red wide" onclick="attackCountry()">⚔️ حمله با ۵۰۰ نیرو</button>':'<button class="btn purple wide" onclick="chooseCountry()">🏳️ انتخاب این کشور</button>'}<div class="muted" style="margin-top:8px">نسخه فعلی برای نمونه‌سازی است؛ قوانین فاصله/همسایگی را بعداً می‌توان اضافه کرد.</div>`;document.getElementById("panel").classList.remove("hidden");drawMap()}
function closePanel(){document.getElementById("panel").classList.add("hidden");selected=null;drawMap()}
async function chooseCountry(){try{await api("/api/choose-country",{method:"POST",body:JSON.stringify({code:selected})});toast("کشور برای تو ثبت شد.");await refreshState()}catch(e){toast(e.message)}}
async function attackCountry(){try{const j=await api("/api/attack",{method:"POST",body:JSON.stringify({code:selected,soldiers:500})});toast(j.result==="victory"?"🏆 کشور فتح شد!":"💥 حمله شکست خورد.");await refreshState()}catch(e){toast(e.message)}}
function addChat(m){const el=document.getElementById("chatList");if(!el)return;el.innerHTML+=`<div class="msg"><b>${esc(m.username)}:</b> ${esc(m.message)}</div>`;el.scrollTop=el.scrollHeight}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function showChat(){document.getElementById("panel").classList.remove("hidden");document.getElementById("panel").innerHTML=`<div class="row"><div class="title">💬 چت جهانی</div><button class="btn ghost" onclick="closePanel()">✕</button></div><div id="chatList" class="chat"></div><div class="row" style="margin-top:8px"><input class="input" id="chatInput" placeholder="پیامت..."><button class="btn" onclick="sendChat()">ارسال</button></div>`;state.chat.forEach(addChat)}
async function sendChat(){const v=document.getElementById("chatInput").value.trim();if(!v)return;try{await api("/api/chat",{method:"POST",body:JSON.stringify({message:v})});document.getElementById("chatInput").value=""}catch(e){toast(e.message)}}
async function showAlliances(){try{const j=await api("/api/alliances");document.getElementById("panel").classList.remove("hidden");document.getElementById("panel").innerHTML=`<div class="row"><div class="title">🤝 اتحادها</div><button class="btn ghost" onclick="closePanel()">✕</button></div><button class="btn purple wide" onclick="createAlliance()">+ ساخت اتحاد</button><div id="alist" style="margin-top:8px">${j.alliances.map(a=>`<div class="box" style="margin:5px 0;text-align:right"><b>[${esc(a.tag)}] ${esc(a.name)}</b><div class="muted">${a.members} عضو</div><button class="btn green" onclick="joinAlliance(${a.id})">عضویت</button></div>`).join("")}</div>`}catch(e){toast(e.message)}}
async function createAlliance(){const name=prompt("نام اتحاد؟"),tag=prompt("تگ کوتاه؟");if(!name||!tag)return;try{await api("/api/alliance/create",{method:"POST",body:JSON.stringify({name,tag})});toast("اتحاد ساخته شد.");showAlliances()}catch(e){toast(e.message)}}
async function joinAlliance(id){try{await api("/api/alliance/join",{method:"POST",body:JSON.stringify({allianceId:id})});toast("عضو اتحاد شدی.");await refreshState();showAlliances()}catch(e){toast(e.message)}}
async function showBoard(){try{const j=await api("/api/leaderboard");document.getElementById("panel").classList.remove("hidden");document.getElementById("panel").innerHTML=`<div class="row"><div class="title">🏆 رتبه‌بندی</div><button class="btn ghost" onclick="closePanel()">✕</button></div>${j.players.map((p,i)=>`<div class="box" style="margin:5px 0;text-align:right"><b>${i+1}. ${esc(p.username)}</b><div class="muted">⚔️ ${Number(p.army).toLocaleString("fa-IR")} • 💰 ${Number(p.gold).toLocaleString("fa-IR")} • سطح ${p.level}</div></div>`).join("")}` }catch(e){toast(e.message)}}
drawAuth(); if(token) {document.getElementById("auth").classList.add("hidden");boot()}
</script>
</body>
</html>
